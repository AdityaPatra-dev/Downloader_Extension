<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowLight {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatBlock {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .pipe-anim {
        stroke-dasharray: 16 12;
        animation: flowLight 2.5s linear infinite;
      }
      .block-float {
        animation: floatBlock 5s ease-in-out infinite;
      }
    </style>

    <linearGradient id="pipeBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="stepCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="360" rx="16" fill="#080c14" />

  <!-- Section Title -->
  <g transform="translate(60, 35)">
    <rect width="190" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="14" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">INSTANT SETUP PIPELINE</text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">4-Step Desktop PC Installation</text>
  </g>

  <!-- CONNECTING ANIMATED DATA PIPES -->
  <g transform="translate(60, 190)">
    <!-- Base track -->
    <line x1="100" y1="0" x2="880" y2="0" stroke="#1e293b" stroke-width="4" />
    <!-- Animated Light Flow -->
    <line x1="100" y1="0" x2="880" y2="0" stroke="url(#pipeBeam)" stroke-width="4" stroke-linecap="round" class="pipe-anim" />
  </g>

  <!-- 4 STEP CARDS -->
  <g transform="translate(60, 110)">
    <!-- STEP 1: Clone Repository -->
    <g transform="translate(0, 0)" class="block-float" filter="url(#boxShadow)">
      <rect width="220" height="190" rx="12" fill="url(#stepCard)" stroke="#334155" stroke-width="1.2"/>
      <!-- Number Circle -->
      <circle cx="34" cy="34" r="16" fill="#6366f1"/>
      <text x="30" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#ffffff">1</text>
      <!-- Title -->
      <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Clone Repo</text>
      <!-- Visual Graphic (3D Terminal) -->
      <g transform="translate(18, 65)">
        <rect width="184" height="60" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
        <circle cx="10" cy="10" r="3" fill="#ef4444"/>
        <circle cx="20" cy="10" r="3" fill="#f59e0b"/>
        <circle cx="30" cy="10" r="3" fill="#10b981"/>
        <text x="10" y="30" font-family="monospace" font-size="10" fill="#38bdf8">$ git clone &lt;repo&gt;</text>
        <text x="10" y="46" font-family="monospace" font-size="10" fill="#94a3b8">cd Downloader_Ext...</text>
      </g>
      <text x="18" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Clone or download this git</text>
      <text x="18" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">repository to your PC folder.</text>
    </g>

    <!-- STEP 2: Open chrome://extensions -->
    <g transform="translate(255, 0)" class="block-float" filter="url(#boxShadow)" style="animation-delay: 1s;">
      <rect width="220" height="190" rx="12" fill="url(#stepCard)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="34" cy="34" r="16" fill="#38bdf8"/>
      <text x="29" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#0f172a">2</text>
      <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Extensions Page</text>
      <!-- Visual Graphic (URL Bar) -->
      <g transform="translate(18, 65)">
        <rect width="184" height="60" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
        <rect x="10" y="16" width="164" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="22" y="34" font-family="monospace" font-size="10" fill="#38bdf8">chrome://extensions</text>
      </g>
      <text x="18" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Enter extensions URL in your</text>
      <text x="18" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Chrome, Edge or Brave bar.</text>
    </g>

    <!-- STEP 3: Developer Mode Switch -->
    <g transform="translate(510, 0)" class="block-float" filter="url(#boxShadow)" style="animation-delay: 2s;">
      <rect width="220" height="190" rx="12" fill="url(#stepCard)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="34" cy="34" r="16" fill="#a855f7"/>
      <text x="29" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#ffffff">3</text>
      <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Developer Mode</text>
      <!-- Visual Graphic (3D Toggle Switch) -->
      <g transform="translate(18, 65)">
        <rect width="184" height="60" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Developer mode</text>
        <!-- Toggle Switch ON -->
        <rect x="115" y="20" width="54" height="26" rx="13" fill="#6366f1"/>
        <circle cx="155" cy="33" r="10" fill="#ffffff"/>
      </g>
      <text x="18" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Toggle "Developer mode" ON</text>
      <text x="18" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">in the top-right corner.</text>
    </g>

    <!-- STEP 4: Load Unpacked dist/ -->
    <g transform="translate(765, 0)" class="block-float" filter="url(#boxShadow)" style="animation-delay: 3s;">
      <rect width="220" height="190" rx="12" fill="url(#stepCard)" stroke="#10b981" stroke-width="1.4"/>
      <circle cx="34" cy="34" r="16" fill="#10b981"/>
      <text x="29" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#022c22">4</text>
      <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#34d399">Load Unpacked</text>
      <!-- Visual Graphic (Load Button & Folder) -->
      <g transform="translate(18, 65)">
        <rect width="184" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
        <rect x="25" y="15" width="134" height="30" rx="6" fill="#10b981"/>
        <text x="35" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#022c22">📁 Select "dist/"</text>
      </g>
      <text x="18" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Click "Load unpacked" and</text>
      <text x="18" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">select the "dist/" folder!</text>
    </g>
  </g>
</svg>
