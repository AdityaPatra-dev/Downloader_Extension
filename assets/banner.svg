<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow & 3D Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Grid / Tech Pattern Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200" />
    <path d="M120,0 V420 M240,0 V420 M360,0 V420 M480,0 V420 M600,0 V420 M720,0 V420 M840,0 V420 M960,0 V420 M1080,0 V420" />
  </g>

  <!-- Background Radial Glows -->
  <circle cx="200" cy="120" r="180" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="220" fill="#d946ef" opacity="0.14" filter="url(#glow)" />
  <circle cx="850" cy="100" r="150" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(80, 80)">
    <!-- REA Extraction Badge -->
    <g transform="translate(0, 0)">
      <rect width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="16" cy="16" r="6" fill="#10b981" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="0.5">
        REVERSE ENGINEERED WITH REA
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
      UNIVERSAL MEDIA
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#purpleGlow)" letter-spacing="-1">
      DOWNLOADER
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Soul Browser's proprietary media sniffing &amp; HLS CMAF dual-track muxer,
    </text>
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      extracted into a high-speed Manifest V3 PC Browser Extension.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 235)">
      <!-- Pill 1: HLS fMP4 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ HLS / fMP4</text>

      <!-- Pill 2: 4K/1080p Mux -->
      <rect x="142" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="156" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a855f7">🎬 Dual-Track Mux</text>

      <!-- Pill 3: Anti-CORS -->
      <rect x="319" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="333" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#10b981">🛡️ Anti-403 Bypass</text>
    </g>
  </g>

  <!-- RIGHT 3D ISOMETRIC CARDS SECTION -->
  <g transform="translate(740, 60)">
    <!-- Glow Backdrop for Cards -->
    <rect x="40" y="30" width="340" height="240" rx="16" fill="url(#purpleGlow)" opacity="0.12" filter="url(#glow)" />

    <!-- Card 1: 3D Floating Video Preview Card (Soul Browser Style) -->
    <g transform="translate(20, 20)" filter="url(#softShadow)">
      <rect width="360" height="260" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />

      <!-- Card Top Bar -->
      <rect width="360" height="42" rx="14" fill="#0f172a" />
      <circle cx="22" cy="21" r="5" fill="#ef4444" />
      <circle cx="38" cy="21" r="5" fill="#f59e0b" />
      <circle cx="54" cy="21" r="5" fill="#10b981" />
      <text x="75" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Renegade Immortal Ep 165</text>

      <!-- Video Player Viewport -->
      <g transform="translate(18, 56)">
        <rect width="324" height="130" rx="8" fill="#000000" stroke="#334155" stroke-width="1" />
        <!-- Big Play Button Center -->
        <circle cx="162" cy="65" r="26" fill="url(#purpleGlow)" filter="url(#glow)" opacity="0.9" />
        <polygon points="156,53 174,65 156,77" fill="#ffffff" />
        <!-- Live Badge -->
        <rect x="12" y="12" width="76" height="20" rx="4" fill="rgba(15,23,42,0.85)" stroke="#38bdf8" stroke-width="0.8" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">1080p FHD</text>
        <rect x="236" y="12" width="76" height="20" rx="4" fill="rgba(15,23,42,0.85)" stroke="#10b981" stroke-width="0.8" />
        <text x="246" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981">~404 MB</text>
      </g>

      <!-- Card Action Footer -->
      <g transform="translate(18, 198)">
        <!-- Quality Selector Dropdown Replica -->
        <rect x="0" y="0" width="170" height="36" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
        <text x="12" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">1080p (H.264 Univ)</text>
        <polygon points="154,16 162,16 158,22" fill="#94a3b8" />

        <!-- Download Button -->
        <rect x="182" y="0" width="142" height="36" rx="6" fill="url(#purpleGlow)" />
        <text x="206" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Download ↓</text>
      </g>
    </g>

    <!-- Card 2: Floating Badge "Soul Browser Extracted" -->
    <g transform="translate(240, 250)" filter="url(#softShadow)">
      <rect width="180" height="48" rx="24" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="24" cy="24" r="14" fill="#0284c7" />
      <text x="18" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#ffffff">⚡</text>
      <text x="46" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">SOUL BROWSER</text>
      <text x="46" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#38bdf8">Algorithm Extracted</text>
    </g>
  </g>
</svg>
