<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dashBorder {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.15; filter: drop-shadow(0 0 10px rgba(99,102,241,0.5)); }
        50% { opacity: 0.35; filter: drop-shadow(0 0 20px rgba(56,189,248,0.8)); }
      }
      .anim-stroke {
        stroke-dasharray: 120 280;
        animation: dashBorder 7s linear infinite;
      }
      .anim-float {
        animation: floatCard 4s ease-in-out infinite;
      }
      .glow-pulse {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="purpleBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="emeraldBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="roseBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1100" height="700" rx="16" fill="#0b0f19" />

  <!-- Section Title -->
  <g transform="translate(60, 50)">
    <rect width="200" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="18" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="0.5">CORE CAPABILITIES MATRIX</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">Built for Modern Adaptive Web Streaming</text>
  </g>

  <!-- GRID: 6 CARDS (2 rows x 3 columns) -->

  <!-- CARD 1: Dual-Track In-Memory Muxer -->
  <g transform="translate(60, 140)">
    <rect width="300" height="240" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <!-- Animated 2D Dynamic Border -->
    <rect width="300" height="240" rx="12" fill="none" stroke="url(#cyanBeam)" stroke-width="2.5" class="anim-stroke" filter="url(#softGlow)"/>

    <!-- 3D Isometric Dual Track Graphic -->
    <g transform="translate(24, 28)">
      <!-- 3D Video Track Layer -->
      <polygon points="20,0 70,12 50,24 0,12" fill="#38bdf8" />
      <polygon points="0,12 50,24 50,32 0,20" fill="#0284c7" />
      <polygon points="50,24 70,12 70,20 50,32" fill="#0369a1" />
      <text x="78" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8">VIDEO (av01/avc1)</text>

      <!-- 3D Audio Track Layer -->
      <g transform="translate(0, 22)">
        <polygon points="20,0 70,12 50,24 0,12" fill="#a855f7" />
        <polygon points="0,12 50,24 50,32 0,20" fill="#7e22ce" />
        <polygon points="50,24 70,12 70,20 50,32" fill="#6b21a8" />
        <text x="78" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#c084fc">AUDIO (mp4a AAC)</text>
      </g>
    </g>

    <text x="24" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Dual-Track fMP4 Muxer</text>
    <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Downloads separated HLS video &amp; audio</text>
    <text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">playlists, patches ISO-BMFF <tspan fill="#38bdf8" font-family="monospace">moov</tspan> headers,</text>
    <text x="24" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">and interleaves fragments into 100%</text>
    <text x="24" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34d399">synchronized playable .mp4 files.</text>
  </g>

  <!-- CARD 2: In-Popup Video Preview -->
  <g transform="translate(400, 140)">
    <rect width="300" height="240" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <rect width="300" height="240" rx="12" fill="none" stroke="url(#purpleBeam)" stroke-width="2.5" class="anim-stroke" filter="url(#softGlow)"/>

    <!-- 3D Mini Player Viewport -->
    <g transform="translate(24, 24)">
      <rect width="120" height="60" rx="6" fill="#000000" stroke="#475569" stroke-width="1" />
      <circle cx="60" cy="30" r="14" fill="url(#purpleBeam)" />
      <polygon points="56,23 68,30 56,37" fill="#ffffff" />
      <rect x="135" y="12" width="115" height="18" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
      <text x="142" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#a5b4fc">▶ HLS.JS ENGINE</text>
      <rect x="135" y="36" width="95" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
      <text x="142" y="49" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#6ee7b7">OFFLINE BUNDLED</text>
    </g>

    <text x="24" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">In-Popup Live Preview</text>
    <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Play any live HLS stream or video modal</text>
    <text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">directly in the popup before downloading.</text>
    <text x="24" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Synthesizes Master Playlists for dual-track</text>
    <text x="24" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#c084fc">audio &amp; video preview with sound.</text>
  </g>

  <!-- CARD 3: Quality & Codec Picker -->
  <g transform="translate(740, 140)">
    <rect width="300" height="240" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <rect width="300" height="240" rx="12" fill="none" stroke="url(#emeraldBeam)" stroke-width="2.5" class="anim-stroke" filter="url(#softGlow)"/>

    <!-- 3D Pills Display -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
      <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#818cf8">1080p (H.264)</text>

      <rect x="120" y="0" width="70" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="130" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">720p</text>

      <rect x="0" y="32" width="70" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="49" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">480p</text>

      <rect x="78" y="32" width="140" height="26" rx="6" fill="#1e1b4b" stroke="#ec4899" stroke-width="1"/>
      <text x="88" y="49" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#f472b6">🎵 Audio Only (M4A)</text>
    </g>

    <text x="24" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Resolution &amp; Codec Picker</text>
    <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Probes master playlists to detect all bitrates.</text>
    <text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Prioritizes universal H.264 for maximum</text>
    <text x="24" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">desktop player compatibility, with real</text>
    <text x="24" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">duration-based file size estimations.</text>
  </g>

  <!-- CARD 4: Live Cancel Controller -->
  <g transform="translate(60, 410)">
    <rect width="300" height="240" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <rect width="300" height="240" rx="12" fill="none" stroke="url(#roseBeam)" stroke-width="2.5" class="anim-stroke" filter="url(#softGlow)"/>

    <!-- 3D Abort Symbol -->
    <g transform="translate(24, 24)">
      <rect width="180" height="34" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <circle cx="20" cy="17" r="7" fill="#ef4444"/>
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="900" fill="#ffffff">✕</text>
      <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">✕ Cancel 42% (170MB)</text>

      <g transform="translate(0, 42)">
        <rect width="250" height="8" rx="4" fill="#334155"/>
        <rect width="110" height="8" rx="4" fill="#ef4444"/>
      </g>
    </g>

    <text x="24" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Live AbortController</text>
    <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Instantly halts active multi-threaded segment</text>
    <text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">fetches without freezing the browser tab</text>
    <text x="24" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">or keeping background worker threads busy.</text>
    <text x="24" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#f87171">Clean memory and blob garbage collection.</text>
  </g>

  <!-- CARD 5: Anti-403 & CORS Bypass -->
  <g transform="translate(400, 410)">
    <rect width="300" height="240" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <rect width="300" height="240" rx="12" fill="none" stroke="url(#cyanBeam)" stroke-width="2.5" class="anim-stroke" filter="url(#softGlow)"/>

    <!-- 3D Shield & Network Route -->
    <g transform="translate(24, 24)">
      <!-- Isometric Shield -->
      <polygon points="30,0 60,10 60,36 30,52 0,36 0,10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#ffffff">🛡️</text>

      <g transform="translate(75, 8)">
        <rect width="165" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="8" y="13" font-family="monospace" font-size="9" fill="#38bdf8">Referer: https://...</text>
        <rect y="24" width="165" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8"/>
        <text x="8" y="37" font-family="monospace" font-size="9" fill="#34d399">Access-Control: *</text>
      </g>
    </g>

    <text x="24" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Anti-Hotlink &amp; CORS Engine</text>
    <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Bypasses strict CDN protections (Akamai,</text>
    <text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Cloudflare, Fastly) using DeclarativeNet-</text>
    <text x="24" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Request dynamic rule injections that replay</text>
    <text x="24" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">authentic video player session headers.</text>
  </g>

  <!-- CARD 6: Multi-Category Batch Engine -->
  <g transform="translate(740, 410)">
    <rect width="300" height="240" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <rect width="300" height="240" rx="12" fill="none" stroke="url(#purpleBeam)" stroke-width="2.5" class="anim-stroke" filter="url(#softGlow)"/>

    <!-- 3D Folder Tabs Graphic -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="58" height="24" rx="4" fill="#6366f1"/>
      <text x="8" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#ffffff">VIDEO (4)</text>

      <rect x="64" y="0" width="58" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">AUDIO (2)</text>

      <rect x="128" y="0" width="58" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="136" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">IMAGES</text>

      <rect x="192" y="0" width="58" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="204" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">DOCS</text>
    </g>

    <text x="24" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Multi-Category Batch Sniffer</text>
    <text x="24" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Categorizes detected resources into Video,</text>
    <text x="24" y="168" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Audio, Images, Documents, and Archives.</text>
    <text x="24" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Supports multi-selection and concurrent</text>
    <text x="24" y="204" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#a855f7">one-click batch queue downloading.</text>
  </g>
</svg>
